name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable test --locked -p mach-cli --test postgres -- --ignored
      - run: cargo +stable build --locked --workspace --release
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
